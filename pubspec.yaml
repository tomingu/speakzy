name: speakzyApp
description: "MUET Speaking Part 1 Recording Timer & AI Coach"
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  record: ^6.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  http: ^1.2.2
  whisper_ggml: ^2.3.0
  wakelock_plus: ^1.2.8
  audio_waveforms: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/